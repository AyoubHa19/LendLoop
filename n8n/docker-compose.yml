# Local n8n for LendLoop:  cd n8n && docker compose up -d
#
#   n8n      editor on http://localhost:5678 (bound to localhost only)
#   mailpit  catches every email n8n sends; inbox on http://localhost:8025
#   gateway  Caddy: forwards ONLY the LendLoop webhook path to n8n
#   tunnel   (opt-in) Cloudflare quick tunnel to the gateway, so Convex (in the
#            cloud) can reach the webhook:  docker compose --profile tunnel up -d
#            Its public URL is in `docker compose logs tunnel`.
#
# Secrets come from n8n/.env (git-ignored; copy .env.example), never from
# this file or from the exported workflows.
name: lendloop-n8n

services:
  n8n:
    image: n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ:-Africa/Casablanca}
      TZ: ${TZ:-Africa/Casablanca}
      # Encrypts credentials stored in n8n's database.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in n8n/.env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Workflows read the LENDLOOP_* values below with $env, so the secret
      # never appears inside a workflow or its exported JSON.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Lets the Code node use Node's crypto module for HMAC.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      LENDLOOP_HMAC_SECRET: ${LENDLOOP_HMAC_SECRET:?set LENDLOOP_HMAC_SECRET in n8n/.env}
      LENDLOOP_CONVEX_SITE_URL: ${LENDLOOP_CONVEX_SITE_URL:?set LENDLOOP_CONVEX_SITE_URL in n8n/.env}
      LENDLOOP_ADMIN_EMAIL: ${LENDLOOP_ADMIN_EMAIL:-admin@lendloop.local}
    volumes:
      - n8n_data:/home/node/.n8n
      # Exported workflows and the (secret-free) Mailpit credential, for
      # `n8n import:workflow` / `n8n import:credentials` — see the README.
      - ./workflows:/workflows:ro
      - ./credentials:/credentials:ro

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web inbox; SMTP (1025) stays inside this network

  gateway:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - n8n

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    # Opens a public URL, so it only starts when asked for explicitly.
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gateway:8080
    depends_on:
      - gateway

volumes:
  n8n_data:
